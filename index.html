<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#e7f1f5">

<title>北海道 7 日旅行</title>

<style>
*{box-sizing:border-box}
:root{
 --blue:#416c86;
 --dark:#243946;
 --muted:#71818c;
 --line:#dce6eb;
 --pale:#edf4f7;
}
body{
 margin:0;
 background:#f6f8f9;
 color:var(--dark);
 font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif;
}
.app{max-width:760px;margin:auto;min-height:100vh}
header{
 padding:22px 16px 14px;
 background:linear-gradient(145deg,#e3f0f5,#fafcfd);
}
h1{font-size:21px;margin:0}
header p{font-size:12px;color:var(--muted);margin:5px 0 0}
.flights{display:flex;gap:7px;margin-top:13px}
.flights div{
 flex:1;background:#ffffffbb;border:1px solid var(--line);
 border-radius:12px;padding:9px;font-size:11px
}
nav{
 position:sticky;top:0;z-index:5;
 display:flex;overflow:auto;gap:6px;padding:9px;
 background:#fbfcfcf2;backdrop-filter:blur(8px);
 border-bottom:1px solid var(--line)
}
nav button{
 min-width:57px;border:1px solid var(--line);
 background:white;color:var(--blue);
 border-radius:10px;padding:7px;font-weight:800
}
nav button small{display:block;font-size:9px}
nav button.on{background:var(--blue);color:white}
main{padding:11px}
.day{display:none}
.day.on{display:block}
.hero{
 position:relative;background:white;border:1px solid var(--line);
 border-radius:16px;padding:13px 150px 13px 13px;
 min-height:86px
}
.hero small{color:var(--blue);font-weight:800}
.hero h2{font-size:18px;margin:4px 0}
.hero a{
 position:absolute;right:8px;top:8px;bottom:8px;width:136px;
 background:var(--blue);color:white;text-decoration:none;
 border-radius:12px;padding:10px;font-size:10px;
 display:flex;flex-direction:column;justify-content:center
}
.hero a b{font-size:12px;margin-top:5px}
.bar{
 height:5px;background:#e1e8eb;border-radius:5px;
 margin:12px 2px 4px;overflow:hidden
}
.bar i{
 display:block;height:100%;width:0;
 background:var(--blue);transition:.2s
}
.status{font-size:10px;color:var(--muted);margin:0 3px 8px}
.stop{
 display:grid;grid-template-columns:24px 32px 1fr;
 gap:7px;align-items:start;background:white;
 border:1px solid var(--line);border-radius:14px;
 padding:11px;margin:7px 0
}
.check{
 width:19px;height:19px;border:1px solid #b9c9d1;
 border-radius:50%;font-size:0;text-align:center
}
.stop.done{opacity:.55}
.stop.done .check{
 background:var(--blue);color:white;font-size:12px;padding-top:1px
}
.ico{font-size:19px}
.stop small,.stop b,.stop p{display:block}
.stop small{font-size:10px;color:var(--blue);font-weight:800}
.stop b{font-size:14px;margin-top:2px}
.stop p{font-size:11px;color:var(--muted);margin:3px 0 7px}
.actions{display:flex;gap:6px}
.actions a{
 font-size:10px;text-decoration:none;
 background:var(--pale);color:#315b72;
 padding:7px 10px;border-radius:8px;font-weight:800
}
.actions a.go{background:var(--blue);color:white}
footer{
 padding:5px 15px 30px;font-size:10px;
 color:var(--muted);line-height:1.5
}
</style>
</head>

<body>
<div class="app">

<header>
<h1>北海道自駕 7 日｜旅行行動地圖</h1>
<p>2026/10/07–10/13 · 小樽・旭川・美瑛・富良野・十勝・札幌</p>

<div class="flights">
<div>✈️ 去程<br><b>10/07 CI0130<br>13:35 新千歲</b></div>
<div>✈️ 回程<br><b>10/13 CI0131<br>15:05 新千歲</b></div>
</div>
</header>

<nav id="tabs"></nav>
<main id="main"></main>

<footer>
10/07～10/11 自駕；札幌還車後改用地鐵、巴士與步行。
道路、交通、班次及營業狀況請以旅行當日官方資訊與 Google Maps 為準。
</footer>

</div>

<script>
const days=[
{
date:"10/07 週三",
title:"抵達・北廣島・小樽",
stops:[
["13:35","✈️","CI0130 抵達新千歲機場","New Chitose Airport","入境、領行李"],
["14:30","🚗","Nippon Rent-A-Car 取車","Nippon Rent-A-Car New Chitose Airport","接駁約 10–15 分；另留手續時間"],
["16:00","🛍️","三井 Outlet 札幌北廣島","Mitsui Outlet Park Sapporo-Kitahiroshima","含 graniph；取車延誤可縮短"],
["17:15","🏨","OMO5 Otaru","OMO5 Otaru by Hoshino Resorts","辦理入住"],
["18:40","🍽️","若鶏時代なると 本店","若鶏時代なると 本店 小樽","晚餐主選｜備選：政寿司 ぜん庵／旭寿司"],
["19:30","📷","小樽運河夜景","Otaru Canal","依體力縮短"]
]},
{
date:"10/08 週四",
title:"小樽散步・旭川",
stops:[
["09:00","📷","小樽運河・大正硝子館・堺町通","Sakaimachi Street Otaru","依各店開門時間購物"],
["12:00","🍽️","小樽午餐・取行李","Otaru","不再加排遠程景點"],
["13:00","🚗","小樽 → 旭川","JR Inn Asahikawa","預留 2.5～3 小時"],
["16:00","🏨","JR Inn・AEON 購物","AEON Mall Asahikawa Station","入住、購物"],
["17:30","🍽️","炉端のユーカラ","炉端のユーカラ 旭川","出發前確認訂位"],
["19:00","🌙","旭川站周邊","Asahikawa Station","散步、回飯店"]
]},
{
date:"10/09 週五",
title:"美瑛・青池・富良野",
stops:[
["09:40","🛍️","美瑛選果 本店","美瑛選果 本店","依營業時間調整"],
["11:00","🍽️","Cafe Junpei","Cafe Junpei Biei","候位超過 30 分改附近定食"],
["12:40","📷","白金青池","Shirogane Blue Pond","Mapcode：349 568 888"],
["13:35","📷","白鬚瀑布","Shirahige Waterfall Hokkaido","指定區停車"],
["15:15","🏨","Furano Natulux Hotel","Furano Natulux Hotel","辦理入住"],
["16:00","☕","森之時計","森の時計 富良野","最後點餐 19:00"],
["18:00","🍽️","富良野晚餐","Furano","くまげら／唯我独尊／小玉家"]
]},
{
date:"10/10 週六",
title:"金山湖・帶廣・十勝川",
stops:[
["09:40","📷","金山湖","Lake Kanayama Hokkaido","雨勢大可取消"],
["12:15","🍽️","豚丼 とん田","豚丼のとん田 帯広","候位久改 はなとかち 或站前店"],
["13:30","☕","六花亭帶廣本店","Rokkatei Obihiro Main Store","喫茶室最後點餐 16:30"],
["14:50","📷","十勝丘公園","Tokachigaoka Park","視天候縮短"],
["15:30","♨️","十勝川溫泉第一飯店","Tokachigawa Onsen Daiichi Hotel","入住後不再開車；溫泉與晚餐"]
]},
{
date:"10/11 週日",
title:"返回札幌・加油還車",
stops:[
["08:00","🚗","十勝川 → 札幌","Tokyu Stay Sapporo Odori","預留約 4 小時"],
["12:00","🧳","Tokyu Stay 寄行李","Tokyu Stay Sapporo Odori","若塞車則優先還車"],
["12:15","⛽","加滿油・Nippon 還車","Nippon Rent-A-Car Susukino","目標 13:00 完成；截止 14:30"],
["13:00","🍛","GARAKU","Soup Curry GARAKU Sapporo","候位超過 30 分改其他店"],
["14:00","☕","BARISTART COFFEE","BARISTART COFFEE Sapporo","10:00–18:00"],
["15:00","🏨","Tokyu Stay Sapporo Odori","Tokyu Stay Sapporo Odori","入住、休息"],
["18:00","🍽️","札幌市區晚餐","Odori Sapporo","晚餐後回飯店"]
]},
{
date:"10/12 週一",
title:"札幌市區散步與購物",
stops:[
["08:00","🍽️","Espresso D'Works","ESPRESSO D WORKS Sapporo","早餐"],
["上午","⛩️","北海道神宮・圓山公園","Hokkaido Jingu","地鐵＋步行"],
["上午","🎓","北海道大學","Hokkaido University Sapporo","依體力縮短"],
["中午","🍽️","札幌 Stellar Place","Sapporo Stellar Place","午餐、短暫購物"],
["下午","☕","北菓樓札幌本館","Kitakaro Sapporo Honkan","甜點先確認庫存"],
["下午","🏛️","赤れんが庁舎","Former Hokkaido Government Office Sapporo","依現場開放時間"],
["晚間","🛍️","Pole Town・3COINS・狸小路","Tanukikoji Shopping Street Sapporo","購物、晚餐"]
]},
{
date:"10/13 週二",
title:"二條市場・咖啡・機場",
stops:[
["07:00","🍽️","二條市場海鮮早餐","Nijo Market Sapporo","ながもり／大磯；候位超過 20 分換店"],
["08:00","☕","時計台ガーデンテラス","時計台ガーデンテラス 札幌","平日 08:00 開門"],
["09:00","🧳","回飯店取行李・退房","Tokyu Stay Sapporo Odori","確認護照、機票與行李"],
["09:35","🚌","薄野機場巴士站","すすきの 南4西3 空港連絡バス","09:59 班次；備用 10:09"],
["11:07","✈️","新千歲機場","New Chitose Airport International Terminal","下車後前往國際線"],
["11:30","✈️","報到・托運・用餐","New Chitose Airport International Terminal","先辦報到與托運"],
["15:05","✈️","CI0131 起飛","New Chitose Airport International Terminal","返回台北"]
]}
];

const enc=x=>encodeURIComponent(x);

function map(q){
 return "https://www.google.com/maps/search/?api=1&query="+enc(q);
}

function route(a,b,d){
 let mode=d<5?"driving":"transit";
 return "https://www.google.com/maps/dir/?api=1&origin="+
 enc(a)+"&destination="+enc(b)+"&travelmode="+mode;
}

const tabs=document.getElementById("tabs");
const main=document.getElementById("main");

days.forEach((d,di)=>{

 let tb=document.createElement("button");
 tb.innerHTML="D"+(di+1)+"<small>"+d.date.split(" ")[0]+"</small>";
 if(di===0)tb.className="on";
 tb.onclick=()=>show(di);
 tabs.appendChild(tb);

 let sec=document.createElement("section");
 sec.className="day"+(di===0?" on":"");
 sec.id="day"+di;

 let first=d.stops[0];

 sec.innerHTML=
 '<div class="hero">'+
 '<small>'+d.date+'</small>'+
 '<h2>'+d.title+'</h2>'+
 '<a target="_blank" href="'+map(first[3])+'">'+
 '現在要去哪裡？<b>'+first[2]+' →</b></a></div>'+
 '<div class="bar"><i id="bar'+di+'"></i></div>'+
 '<div class="status"><b id="count'+di+'">0 / '+d.stops.length+
 '</b> 已完成</div>';

 d.stops.forEach((s,i)=>{

   let card=document.createElement("div");
   card.className="stop";

   let go=i===0?map(s[3]):route(d.stops[i-1][3],s[3],di);

   card.innerHTML=
   '<div class="check">✓</div>'+
   '<div class="ico">'+s[1]+'</div>'+
   '<div><small>'+s[0]+'</small>'+
   '<b>'+s[2]+'</b>'+
   '<p>'+s[4]+'</p>'+
   '<div class="actions">'+
   '<a target="_blank" href="'+map(s[3])+'">📍 地圖</a>'+
   '<a class="go" target="_blank" href="'+go+'">➜ 導航</a>'+
   '</div></div>';

   let key="hokkaido-"+di+"-"+i;

   if(localStorage.getItem(key)==="1"){
      card.classList.add("done");
   }

   card.querySelector(".check").onclick=()=>{
      card.classList.toggle("done");
      localStorage.setItem(
        key,
        card.classList.contains("done")?"1":"0"
      );
      update(di);
   };

   sec.appendChild(card);
 });

 main.appendChild(sec);
 update(di);
});

function show(n){
 document.querySelectorAll(".day").forEach(
   (x,i)=>x.classList.toggle("on",i===n)
 );
 document.querySelectorAll("nav button").forEach(
   (x,i)=>x.classList.toggle("on",i===n)
 );
 window.scrollTo({top:0,behavior:"smooth"});
}

function update(d){
 let cards=[...document.querySelectorAll("#day"+d+" .stop")];
 let n=cards.filter(x=>x.classList.contains("done")).length;

 document.getElementById("count"+d).textContent=
 n+" / "+cards.length;

 document.getElementById("bar"+d).style.width=
 (n/cards.length*100)+"%";
}
</script>

</body>
</html>
