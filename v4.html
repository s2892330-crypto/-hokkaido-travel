<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#e8f1f5">

<title>北海道 7 日旅行 V4</title>

<style>
*{box-sizing:border-box}
:root{
 --blue:#416c86;
 --blue2:#31586f;
 --dark:#223845;
 --muted:#70808b;
 --line:#dce6eb;
 --pale:#edf4f7;
 --warn:#fff3dc;
 --warnline:#e7c478;
 --danger:#9a553f;
 --green:#527566;
}
body{
 margin:0;
 background:#f5f8f9;
 color:var(--dark);
 font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif;
}
.app{
 max-width:760px;
 margin:auto;
 min-height:100vh;
}
header{
 padding:22px 16px 14px;
 background:linear-gradient(145deg,#e3f0f5,#fbfcfd);
}
h1{
 margin:0;
 font-size:21px;
}
header>p{
 margin:5px 0 0;
 color:var(--muted);
 font-size:12px;
}
.tripstate{
 margin-top:13px;
 background:#ffffffc7;
 border:1px solid var(--line);
 border-radius:14px;
 padding:11px 12px;
}
.tripstate small{
 display:block;
 color:var(--muted);
 font-size:10px;
}
.tripstate b{
 display:block;
 margin-top:3px;
 font-size:14px;
 color:var(--blue2);
}
.flights{
 display:flex;
 gap:7px;
 margin-top:8px;
}
.flights div{
 flex:1;
 background:#ffffffa8;
 border:1px solid var(--line);
 border-radius:11px;
 padding:8px;
 font-size:10px;
}
.flights b{
 display:block;
 margin-top:2px;
 font-size:11px;
}
nav{
 position:sticky;
 top:0;
 z-index:20;
 display:flex;
 gap:6px;
 overflow:auto;
 padding:9px;
 background:#fbfcfcf2;
 backdrop-filter:blur(10px);
 border-bottom:1px solid var(--line);
}
nav button{
 min-width:58px;
 border:1px solid var(--line);
 background:white;
 color:var(--blue);
 border-radius:11px;
 padding:7px;
 font-weight:800;
}
nav button small{
 display:block;
 font-size:9px;
 margin-top:1px;
}
nav button.on{
 background:var(--blue);
 color:white;
}
main{
 padding:11px;
}
.day{
 display:none;
}
.day.on{
 display:block;
}
.daytitle{
 margin:3px 2px 9px;
}
.daytitle small{
 color:var(--blue);
 font-weight:800;
}
.daytitle h2{
 font-size:20px;
 margin:3px 0;
}
.daytitle p{
 margin:0;
 color:var(--muted);
 font-size:11px;
}
.smart{
 background:linear-gradient(145deg,#416c86,#31586f);
 color:white;
 border-radius:18px;
 padding:14px;
 margin-bottom:9px;
 box-shadow:0 4px 15px rgba(40,70,90,.12);
}
.smartlabel{
 font-size:10px;
 opacity:.8;
 margin-bottom:3px;
}
.smart h3{
 font-size:17px;
 margin:0 0 3px;
}
.smart p{
 font-size:11px;
 margin:0;
 opacity:.85;
}
.smartline{
 height:1px;
 background:#ffffff35;
 margin:12px 0;
}
.nextrow{
 display:grid;
 grid-template-columns:1fr 125px;
 gap:8px;
 align-items:center;
}
.nextrow b{
 display:block;
 font-size:14px;
}
.nextrow small{
 display:block;
 opacity:.8;
 margin-top:3px;
 font-size:10px;
}
.nextrow a{
 text-decoration:none;
 background:white;
 color:var(--blue2);
 border-radius:10px;
 padding:10px 7px;
 text-align:center;
 font-size:11px;
 font-weight:900;
}
.alert{
 border:1px solid var(--warnline);
 background:var(--warn);
 border-radius:15px;
 padding:12px;
 margin:9px 0;
}
.alert strong{
 display:block;
 font-size:14px;
 color:#775626;
}
.alert p{
 margin:4px 0 0;
 font-size:11px;
 line-height:1.55;
 color:#765f3d;
}
.airport{
 background:#eef2f8;
 border-color:#bdc9db;
}
.airport strong{
 color:#405875;
}
.airport p{
 color:#586a80;
}
.hotelbar{
 display:flex;
 gap:7px;
 margin:8px 0;
 overflow:auto;
}
.hotelbar a{
 white-space:nowrap;
 text-decoration:none;
 border:1px solid var(--line);
 background:white;
 color:var(--blue);
 border-radius:10px;
 padding:8px 10px;
 font-size:10px;
 font-weight:800;
}
.progress{
 height:5px;
 background:#e1e8eb;
 border-radius:6px;
 overflow:hidden;
 margin:11px 2px 4px;
}
.progress i{
 display:block;
 width:0;
 height:100%;
 background:var(--green);
 transition:.2s;
}
.status{
 display:flex;
 align-items:center;
 font-size:10px;
 color:var(--muted);
 margin:0 3px 8px;
}
.status button{
 margin-left:auto;
 border:0;
 background:none;
 color:var(--blue);
 font-size:10px;
}
.stop{
 display:grid;
 grid-template-columns:24px 32px 1fr;
 gap:7px;
 align-items:start;
 background:white;
 border:1px solid var(--line);
 border-radius:14px;
 padding:11px;
 margin:7px 0;
}
.stop.current{
 border:2px solid var(--blue);
 box-shadow:0 3px 12px rgba(50,90,115,.10);
}
.check{
 width:19px;
 height:19px;
 border:1px solid #b8c8d0;
 border-radius:50%;
 font-size:0;
 text-align:center;
 cursor:pointer;
}
.stop.done{
 opacity:.5;
}
.stop.done .check{
 background:var(--green);
 color:white;
 font-size:12px;
 padding-top:1px;
}
.ico{
 font-size:19px;
}
.stop small,
.stop b,
.stop p{
 display:block;
}
.stop small{
 font-size:10px;
 color:var(--blue);
 font-weight:800;
}
.stop b{
 font-size:14px;
 margin-top:2px;
}
.stop p{
 font-size:11px;
 color:var(--muted);
 margin:3px 0 7px;
 line-height:1.4;
}
.badge{
 display:inline-block;
 background:#f6f0df;
 color:#765d27;
 border-radius:6px;
 padding:4px 6px;
 font-size:9px;
 margin:0 0 7px;
}
.actions{
 display:flex;
 gap:6px;
 flex-wrap:wrap;
}
.actions a{
 text-decoration:none;
 background:var(--pale);
 color:#315b72;
 border-radius:8px;
 padding:7px 10px;
 font-size:10px;
 font-weight:800;
}
.actions a.go{
 background:var(--blue);
 color:white;
}
footer{
 padding:6px 15px 30px;
 color:var(--muted);
 font-size:10px;
 line-height:1.5;
}
</style>
</head>
