<style>
*{
  box-sizing:border-box;
}

:root{
  --blue:#416c86;
  --blue2:#31586f;
  --dark:#243946;
  --muted:#71818c;
  --line:#dce6eb;
  --pale:#edf4f7;
  --green:#527566;
  --warn:#fff3dc;
  --warnline:#e7c478;
}

body{
  margin:0;
  background:#f6f8f9;
  color:var(--dark);
  font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","Segoe UI",sans-serif;
}

.app{
  max-width:760px;
  margin:auto;
  min-height:100vh;
}

header{
  padding:20px 16px 14px;
  background:linear-gradient(145deg,#e3f0f5,#fafcfd);
}

h1{
  font-size:21px;
  margin:0;
}

header p{
  font-size:12px;
  color:var(--muted);
  margin:5px 0 0;
}

.trip-status{
  margin-top:12px;
  padding:10px 12px;
  background:white;
  border:1px solid var(--line);
  border-radius:12px;
  color:var(--blue);
  font-size:12px;
  font-weight:800;
}

.flights{
  display:flex;
  gap:7px;
  margin-top:9px;
}

.flights div{
  flex:1;
  background:#ffffffbb;
  border:1px solid var(--line);
  border-radius:12px;
  padding:9px;
  font-size:10px;
}

.flights b{
  display:block;
  font-size:11px;
  margin-top:2px;
}

nav{
  position:sticky;
  top:0;
  z-index:10;
  display:flex;
  gap:6px;
  overflow:auto;
  padding:9px;
  background:#fbfcfcf2;
  backdrop-filter:blur(9px);
  border-bottom:1px solid var(--line);
}

nav button{
  min-width:58px;
  border:1px solid var(--line);
  background:white;
  color:var(--blue);
  border-radius:10px;
  padding:7px;
  font-weight:800;
}

nav button small{
  display:block;
  font-size:9px;
  margin-top:1px;
}

nav button.on{
  background:var(--blue);
  color:white;
}

main{
  padding:11px;
}

.day{
  display:none;
}

.day.on{
  display:block;
}

.day-title{
  margin:3px 2px 9px;
}

.day-title small{
  color:var(--blue);
  font-weight:800;
}

.day-title h2{
  font-size:19px;
  margin:3px 0;
}

.day-title p{
  margin:0;
  color:var(--muted);
  font-size:11px;
}

.smart{
  background:linear-gradient(145deg,var(--blue),var(--blue2));
  color:white;
  padding:14px;
  border-radius:17px;
  margin:9px 0;
}

.smart-label{
  font-size:10px;
  opacity:.78;
}

.smart h3{
  margin:3px 0;
  font-size:16px;
}

.smart p{
  margin:0;
  font-size:11px;
  opacity:.88;
}

.smart hr{
  border:0;
  border-top:1px solid #ffffff40;
  margin:11px 0;
}

.smart a{
  display:inline-block;
  margin-top:8px;
  padding:9px 12px;
  border-radius:9px;
  background:white;
  color:var(--blue2);
  text-decoration:none;
  font-size:11px;
  font-weight:900;
}

.alert{
  margin:8px 0;
  padding:11px;
  background:var(--warn);
  border:1px solid var(--warnline);
  border-radius:13px;
  color:#70572f;
  font-size:11px;
  line-height:1.55;
}

.alert strong{
  display:block;
  font-size:13px;
  margin-bottom:3px;
}

.hotel{
  display:inline-block;
  min-height:44px;
  line-height:28px;
  margin:2px 0 8px;
  padding:8px 12px;
  border:1px solid var(--line);
  border-radius:10px;
  background:white;
  color:var(--blue);
  text-decoration:none;
  font-size:11px;
  font-weight:800;
}

.progress{
  height:5px;
  background:#e2e9ec;
  border-radius:5px;
  overflow:hidden;
  margin:7px 2px 4px;
}

.progress i{
  display:block;
  height:100%;
  width:0;
  background:var(--green);
  transition:.2s;
}

.progress-text{
  font-size:10px;
  color:var(--muted);
  margin:0 3px 8px;
}

.stop{
  display:grid;
  grid-template-columns:26px 31px 1fr;
  gap:7px;
  align-items:start;
  padding:11px;
  margin:7px 0;
  background:white;
  border:1px solid var(--line);
  border-radius:14px;
}

.stop.current{
  border:2px solid var(--blue);
  box-shadow:0 3px 12px rgba(50,90,115,.10);
}

.stop.done{
  opacity:.5;
}

.check{
  width:20px;
  height:20px;
  border:1px solid #b8c8d0;
  border-radius:50%;
  text-align:center;
  font-size:0;
  cursor:pointer;
}

.stop.done .check{
  background:var(--green);
  color:white;
  font-size:12px;
  padding-top:1px;
}

.ico{
  font-size:19px;
}

.stop small{
  display:block;
  color:var(--blue);
  font-size:10px;
  font-weight:800;
}

.stop b{
  display:block;
  font-size:14px;
  margin-top:2px;
}

.stop p{
  margin:3px 0 7px;
  color:var(--muted);
  font-size:11px;
  line-height:1.4;
}

.note{
  display:inline-block;
  margin-bottom:7px;
  padding:5px 7px;
  background:#fff3d9;
  color:#755d2e;
  border-radius:7px;
  font-size:10px;
}

.actions{
  display:flex;
  gap:6px;
  flex-wrap:wrap;
}

.actions a,
.actions button{
  min-height:44px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  border:0;
  border-radius:8px;
  padding:8px 11px;
  background:var(--pale);
  color:#315b72;
  text-decoration:none;
  font-size:10px;
  font-weight:800;
}

.actions a.go{
  background:var(--blue);
  color:white;
}

footer{
  padding:8px 15px 30px;
  color:var(--muted);
  font-size:10px;
  line-height:1.5;
}
</style>
</head>

/* ---------- BASIC HELPERS ---------- */

const enc = value => encodeURIComponent(value);

function mapURL(query){
  return "https://www.google.com/maps/search/?api=1&query=" + enc(query);
}

function routeURL(origin,destination,dayIndex){

  const mode = dayIndex <= 4 ? "driving" : "transit";

  return "https://www.google.com/maps/dir/?api=1" +
    "&origin=" + enc(origin) +
    "&destination=" + enc(destination) +
    "&travelmode=" + mode;
}

/* ---------- TIME ---------- */

function firstTime(text){

  const match = String(text).match(/(\d{1,2}):(\d{2})/);

  if(!match){
    return null;
  }

  return Number(match[1]) * 60 + Number(match[2]);
}

function currentMinutes(){

  const now = new Date();

  return now.getHours() * 60 + now.getMinutes();
}

/* ---------- TRAVEL DATE ---------- */

function currentTripDay(){

  const now = new Date();

  if(now.getFullYear() !== tripYear){
    return -1;
  }

  if(now.getMonth() !== 9){
    return -1;
  }

  const date = now.getDate();

  if(date < 7 || date > 13){
    return -1;
  }

  return date - 7;
}

function initialDay(){

  const now = new Date();

  const start = new Date(2026,9,7,0,0,0);

  const end = new Date(2026,9,13,23,59,59);

  const status = document.getElementById("tripStatus");

  if(now < start){

    const daysLeft = Math.ceil(
      (start.getTime() - now.getTime()) / 86400000
    );

    status.textContent =
      "距離北海道出發還有 " +
      daysLeft +
      " 天｜目前預覽 DAY 1";

    return 0;
  }

  if(now > end){

    status.textContent =
      "北海道 7 日旅程已結束｜仍可查看 DAY 1～DAY 7";

    return 6;
  }

  const day = currentTripDay();

  if(day >= 0){

    status.textContent =
      "今天是 DAY " +
      (day + 1) +
      "｜" +
      days[day].date +
      " " +
      days[day].week;

    return day;
  }

  status.textContent = "北海道旅行預覽模式";

  return 0;
}

/* ---------- CURRENT / NEXT ---------- */

function smartIndex(dayIndex){

  if(currentTripDay() !== dayIndex){
    return 0;
  }

  const now = currentMinutes();

  let result = 0;

  days[dayIndex].stops.forEach((stop,index)=>{

    const value = firstTime(stop.time);

    if(value !== null && now >= value){
      result = index;
    }

  });

  return result;
}

/* ---------- CLIPBOARD ---------- */

async function copyText(value,button){

  try{

    if(navigator.clipboard && navigator.clipboard.writeText){

      await navigator.clipboard.writeText(value);

      const original = button.textContent;

      button.textContent = "已複製";

      setTimeout(()=>{
        button.textContent = original;
      },1200);

      return;
    }

  }catch(error){
    console.log("Clipboard unavailable");
  }

  window.prompt(
    "請手動複製 Mapcode：",
    value
  );
}

/* ---------- PROGRESS ---------- */

function updateProgress(dayIndex){

  const cards = [
    ...document.querySelectorAll(
      "#day" +
      dayIndex +
      " .stop"
    )
  ];

  const completed =
    cards.filter(
      card =>
        card.classList.contains("done")
    ).length;

  const total = cards.length;

  const percentage =
    total === 0
    ? 0
    : completed / total * 100;

  document.getElementById(
    "progress" + dayIndex
  ).style.width =
    percentage + "%";

  document.getElementById(
    "progressText" + dayIndex
  ).textContent =
    "今日進度：" +
    completed +
    " / " +
    total;
}

/* ---------- DAY SWITCH ---------- */

function showDay(dayIndex){

  document
    .querySelectorAll(".day")
    .forEach((page,index)=>{

      page.classList.toggle(
        "on",
        index === dayIndex
      );

    });

  document
    .querySelectorAll("nav button")
    .forEach((button,index)=>{

      button.classList.toggle(
        "on",
        index === dayIndex
      );

    });

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });
}
